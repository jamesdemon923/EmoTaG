# EmoTaG few-shot adaptation configuration (single identity, ~5s clip).
#
# Loads the pre-trained EMA motion network and adapts only the AdaIN layers
# (--adapt_adain_only) plus the per-scene Gaussians to a new identity. The entry
# point is adapt_emotag.py; scripts/adapt.sh reads the same defaults.

data:
  source_path: data/<ID>       # -s : one processed identity scene
  audio_extractor: whisper
  N_views: 125                 # ~5s @25fps; use -1 to use all frames

optimization:
  iterations: 20000            # paper budget for adaptation
  warm_up_iter: 1000           # static appearance only during warmup
  lambda_dssim: 0.2
  gaussian_lr: 0.005
  motion_net_lr: 0.0005        # adapt lr_net (higher than pretrain; AdaIN + novel identity code train, plus the FLAME/mouth heads with --adapt_unfreeze_heads)
  adapt_adain_only: true       # freeze everything except AdaIN (freeze_for_adaptation)
  # Sapiens geometry priors ON for adaptation (needs sapiens/{depth,normal}):
  w_geo_depth: 0.01            # λ_D
  w_geo_normal: 0.001          # λ_N

  # Defaults of adapt_emotag.py (see README, "Few-shot adaptation"):
  au_mode: decoupled           # jaw/lower face from audio only; AUs -> upper face (--au_mode legacy)
  window_supervision: true     # supervise all 8 frames of the audio window (--no_window_supervision)
  w_vel: 1.0                   # FLAME velocity term
  audio_lag_calibration: true  # measured on the adaptation clip (--no_audio_lag_calibration)
  random_background: true      # random colour per step (--fixed_background for the green screen)
  intraoral: rigid             # mouth interior bound to the teeth geometry
  intraoral_contain: true
  intraoral_budget: 6000
  motion_steps: 1000           # audio-to-motion heads fitted for 1000 steps, then frozen

misc:
  seed: 0
  sh_degree: 2

# Reference command:
#   CUDA_VISIBLE_DEVICES=0 python adapt_emotag.py \
#     -s data/<ID> -m output/adapt/<ID> --audio_extractor whisper \
#     --pretrain_path chkpnt_ema_face_latest.pth \
#     --iterations 20000 --warm_up_iter 1000 --adapt_adain_only --adapt_unfreeze_heads \
#     --N_views 125 --intraoral rigid --intraoral_contain --intraoral_budget 6000 --motion_steps 1000
# Output: output/adapt/<ID>/chkpnt_face_latest.pth
